<!DOCTYPE html>
<html>

<head>
    <script src="app.js" defer></script>

</head>

<body>
    <h1>Cipher</h1>
    <h3>Use your code and insert your text. Text can only include letters, numbers, and spaces.</h3>
    <label for="text-input">Add your text here:</label>
    <input type="text" id="text-input">
    <button id="submit">Submit</button>
    <br><br>
    <select name="code" id="code">
        <option value="">--Choose your code--</option>
        <option value="pneumonia">Pneumonia</option>
        <option value="cuddy">Cuddy</option>
        <option value="lupus">Lupus</option>
        <option value="mousebite">Mousebite</option>
        <option value="piano">Piano</option>

    </select>
    <br><br>
    <label for="decipher-check">Decipher?</label>
    <input type="checkbox" id="decipher-check">
    <br> <br> <br>
    <p>Output:</p>
    <p id="output"></p>
</body>

</html>
